<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Box Control Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div class="container">
        <h1>Love Box Control Panel</h1>
        
        <!-- Original Upload Form -->
        <div class="section">
            <h2>Upload Image or GIF</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" name="file" id="fileInput" accept=".png, .gif">
                <button type="submit">Upload & Send</button>
            </form>
        </div>

        <!-- New Drawing Canvas Section -->
        <div class="section">
            <h2>Draw a Message</h2>
            <canvas id="drawCanvas" width="320" height="240"></canvas>
            <div class="button-group">
                <button type="button" id="clearBtn">Clear</button>
                <button type="button" id="sendDrawingBtn">Send Drawing</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
