<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovebox - Send Drawing or Picture</title>
    <link rel="stylesheet" href="/static/index.css">
</head>
<body>
    <div class="container">
        <h1>Lovebox Sender</h1>
        
        <!-- Canvas Drawing Section -->
        <div class="drawing-section">
            <h3>Draw Something</h3>
            <canvas id="drawingCanvas" width="320" height="240"></canvas>
            <div class="button-group">
                <button id="clearBtn" type="button">Clear</button>
                <button id="sendBtn" type="button">Send Drawing</button>
            </div>
        </div>

        <hr style="margin: 20px 0;">

        <!-- Standard Picture / GIF Upload Section -->
        <div class="upload-section">
            <h3>Or Upload a Picture/GIF</h3>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*" required>
                <button type="submit">Upload Picture</button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
